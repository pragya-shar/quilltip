name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Component convention fixtures
        run: bun run test:component-organization

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: quality

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CONVEX_URL: 'https://placeholder.convex.cloud'
          NEXT_PUBLIC_STELLAR_NETWORK: 'TESTNET'
          NEXT_PUBLIC_HORIZON_URL: 'https://horizon-testnet.stellar.org'
          NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run test:security
      - run: bun run security:audit

  required:
    name: Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, build, audit]
    if: always()
    steps:
      - name: Check required CI jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          failed=0

          check_result() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "$name did not pass: $result"
              failed=1
            fi
          }

          check_result "Lint & Typecheck" "$QUALITY_RESULT"
          check_result "Build" "$BUILD_RESULT"
          check_result "Dependency Audit" "$AUDIT_RESULT"

          exit "$failed"
