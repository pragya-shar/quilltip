name: CI

on:
  push:
    branches: [main, overhaul/v2]
  pull_request:
    branches: [main, overhaul/v2]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Bun version guard
        run: bun scripts/check-bun-version.ts

      - name: Component convention fixtures
        run: bun run test:component-organization

      - name: Unit tests (network, guard, health, profile)
        run: bun run test:unit

      - name: Highlight behavior regressions
        run: bun run test:highlights

      - name: Reader end-matter regressions
        run: bun run test:reader

      - name: Waitlist, feedback and analytics regressions
        run: bun run test:beta

      - name: Dependency compatibility regressions
        run: bun run test:dependency-compatibility

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: quality

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CONVEX_URL: 'https://placeholder.convex.cloud'
          NEXT_PUBLIC_STELLAR_NETWORK: 'TESTNET'
          NEXT_PUBLIC_HORIZON_URL: 'https://horizon-testnet.stellar.org'
          NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'

  perf-budget:
    name: Page-load Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: quality

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Fixture data from a local stand-in (scripts/perf/convex-fixture.ts);
      # no backend or secrets.
      - name: Build against the fixture backend
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CONVEX_URL: 'http://127.0.0.1:3299'
          NEXT_PUBLIC_STELLAR_NETWORK: 'TESTNET'
          NEXT_PUBLIC_HORIZON_URL: 'https://horizon-testnet.stellar.org'
          NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'

      - name: Check page-load budget
        run: bun run perf:budget

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run test:security
      - run: bun run security:audit

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Each crate pins its toolchain and wasm target in rust-toolchain.toml.
      # rustup selects it from the working directory, so run cargo inside it.
      - name: Build and test each contract
        run: |
          for dir in contracts/*/; do
            echo "::group::$dir"
            (
              cd "$dir"
              rustup toolchain install
              rustc --version
              cargo build --locked --target wasm32v1-none --release
              cargo test --locked
            )
            echo "::endgroup::"
          done

  e2e-fixtures:
    name: Playwright (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run fixture suites (no secrets, no backend)
        run: bun run test:e2e:fixtures

  required:
    name: Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, build, audit, contracts, e2e-fixtures]
    if: always()
    steps:
      - name: Check required CI jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          E2E_FIXTURES_RESULT: ${{ needs.e2e-fixtures.result }}
        run: |
          failed=0

          check_result() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "$name did not pass: $result"
              failed=1
            fi
          }

          check_result "Lint & Typecheck" "$QUALITY_RESULT"
          check_result "Build" "$BUILD_RESULT"
          check_result "Dependency Audit" "$AUDIT_RESULT"
          check_result "Contracts" "$CONTRACTS_RESULT"
          check_result "Playwright (fixtures)" "$E2E_FIXTURES_RESULT"

          exit "$failed"
