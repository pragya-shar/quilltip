name: CI

on:
  push:
    branches: [main, overhaul/v2]
  pull_request:
    branches: [main, overhaul/v2]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Bun version guard
        run: bun scripts/check-bun-version.ts

      - name: Component convention fixtures
        run: bun run test:component-organization

      - name: Unit tests (network, guard, health, profile)
        run: bun run test:unit

      - name: Highlight behavior regressions
        run: bun run test:highlights

      - name: Reader end-matter regressions
        run: bun run test:reader

      - name: Waitlist, feedback and analytics regressions
        run: bun run test:beta

      - name: Dependency compatibility regressions
        run: bun run test:dependency-compatibility

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: quality

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CONVEX_URL: 'https://placeholder.convex.cloud'
          NEXT_PUBLIC_STELLAR_NETWORK: 'TESTNET'
          NEXT_PUBLIC_HORIZON_URL: 'https://horizon-testnet.stellar.org'
          NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run test:security
      - run: bun run security:audit

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rustup selects the pinned toolchain from contracts/rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit@0.23.0

      - name: Dependency audit
        run: cargo audit --deny warnings

      # The v1 tipping contract keeps its own lockfile and toolchain until cutover.
      - name: Build and test the v1 tipping contract
        working-directory: contracts/tipping
        run: |
          rustup toolchain install
          cargo build --locked --target wasm32v1-none --release
          cargo test --locked

      - name: Check test snapshots are committed
        working-directory: .
        run: |
          changes="$(git status --porcelain -- contracts)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat -- contracts
            echo "::error::Contract tests changed or added files under contracts/. Run the tests in contracts/ (and contracts/tipping/) and commit the result."
            exit 1
          fi

      # Optimized build with the Stellar CLI in a digest-pinned container.
      # The script fails when a Wasm exceeds 120,000 bytes.
      - name: Reproducible optimized build and size gate
        working-directory: .
        run: scripts/contracts/build-reproducible.sh --out "$RUNNER_TEMP/wasm"

      - name: Rebuild and compare Wasm hashes
        working-directory: .
        run: |
          scripts/contracts/build-reproducible.sh --out "$RUNNER_TEMP/wasm-rebuild"
          diff "$RUNNER_TEMP/wasm/SHA256SUMS" "$RUNNER_TEMP/wasm-rebuild/SHA256SUMS"

      - name: Record Wasm sizes and hashes
        working-directory: .
        run: |
          {
            echo "### Contract Wasm"
            echo
            echo '| Wasm | Bytes | SHA-256 |'
            echo '| ---- | ----: | ------- |'
            tail -n +2 "$RUNNER_TEMP/wasm/sizes.tsv" | awk -F '\t' '{ printf "| %s | %s | `%s` |\n", $1, $2, $3 }'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-wasm
          path: |
            ${{ runner.temp }}/wasm/*.wasm
            ${{ runner.temp }}/wasm/SHA256SUMS
            ${{ runner.temp }}/wasm/sizes.tsv
          if-no-files-found: error

  e2e-fixtures:
    name: Playwright (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run fixture suites (no secrets, no backend)
        run: bun run test:e2e:fixtures

  required:
    name: Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, build, audit, contracts, e2e-fixtures]
    if: always()
    steps:
      - name: Check required CI jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          E2E_FIXTURES_RESULT: ${{ needs.e2e-fixtures.result }}
        run: |
          failed=0

          check_result() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "$name did not pass: $result"
              failed=1
            fi
          }

          check_result "Lint & Typecheck" "$QUALITY_RESULT"
          check_result "Build" "$BUILD_RESULT"
          check_result "Dependency Audit" "$AUDIT_RESULT"
          check_result "Contracts" "$CONTRACTS_RESULT"
          check_result "Playwright (fixtures)" "$E2E_FIXTURES_RESULT"

          exit "$failed"
