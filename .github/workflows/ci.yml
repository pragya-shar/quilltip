name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:once

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CONVEX_URL: 'https://placeholder.convex.cloud'
          NEXT_PUBLIC_STELLAR_NETWORK: 'TESTNET'
          NEXT_PUBLIC_HORIZON_URL: 'https://horizon-testnet.stellar.org'
          NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit || true

  required:
    name: Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, build]
    if: always()
    steps:
      - name: Check required CI jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failed=0

          check_result() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "$name did not pass: $result"
              failed=1
            fi
          }

          check_result "Lint, Typecheck & Test" "$QUALITY_RESULT"
          check_result "Build" "$BUILD_RESULT"

          exit "$failed"
