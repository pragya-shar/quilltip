# cargo-fuzz targets for the Tab contract (`docs/architecture/v2/08-testing-and-deployment.md`, section 8.1).
# Outside the contracts workspace: cargo-fuzz needs a nightly toolchain.
# Run from this directory: cargo +nightly fuzz run settle_vouchers -- -max_total_time=600
[package]
name = "quilltip-tab-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
sha2 = "0.10"
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
quilltip-tab = { path = ".." }
quilltip-shared = { path = "../../shared" }

[[bin]]
name = "settle_vouchers"
path = "fuzz_targets/settle_vouchers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "voucher_decode"
path = "fuzz_targets/voucher_decode.rs"
test = false
doc = false
bench = false

[workspace]
